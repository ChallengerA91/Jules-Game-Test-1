<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farming Tycoon RTS 100x</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background: #e8f5e9; margin: 0; padding: 20px; }
        h1 { color: #2e7d32; margin-bottom: 10px; }
        #game-container { display: flex; gap: 20px; max-width: 1200px; width: 100%; }
        canvas { background: #c8e6c9; border: 8px solid #5d4037; border-radius: 8px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        #sidebar { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { background: #f1f8e9; padding: 10px; border-radius: 4px; text-align: center; }
        .stat-val { font-size: 1.4em; font-weight: bold; color: #388e3c; }
        .stat-label { font-size: 0.8em; color: #666; text-transform: uppercase; }

        .crop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .crop-btn { border: 1px solid #ccc; background: #fff; padding: 10px; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .crop-btn:hover { background: #f0f0f0; transform: translateY(-2px); }
        .crop-btn.selected { border: 2px solid #2e7d32; background: #e8f5e9; }
        .crop-emoji { font-size: 1.5em; display: block; }
        .crop-price { font-size: 0.8em; color: #444; }

        .upgrade-list { display: flex; flex-direction: column; gap: 5px; }
        .upgrade-btn { padding: 10px; cursor: pointer; background: #fffde7; border: 1px solid #fbc02d; border-radius: 4px; display: flex; justify-content: space-between; }
        .upgrade-btn:hover:not(:disabled) { background: #fff9c4; }
        .upgrade-btn:disabled { opacity: 0.5; cursor: default; }

        #leaderboard { list-style: none; padding: 0; margin: 0; }
        #leaderboard li { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .weather-panel { text-align: center; font-weight: bold; padding: 10px; border-radius: 4px; }
        .weather-Sunny { background: #fff9c4; color: #fbc02d; }
        .weather-Rainy { background: #bbdefb; color: #1976d2; }
        .weather-Heatwave { background: #ffccbc; color: #d84315; }
        .weather-Storm { background: #cfd8dc; color: #455a64; }

        .event-ticker { background: #ffecb3; padding: 5px; font-size: 0.9em; border-left: 4px solid #ffa000; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Farming Tycoon RTS 100x</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="sidebar">
            <div class="panel">
                <div id="weather-box" class="weather-panel weather-Sunny">
                    Weather: <span id="weather-type">Sunny</span> (x<span id="weather-mult">1.0</span>)
                </div>
                <div id="event-ticker" class="event-ticker" style="display:none"></div>
            </div>

            <div class="panel">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-val">$<span id="money">0</span></div>
                        <div class="stat-label">Wallet</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val">#<span id="tick">0</span></div>
                        <div class="stat-label">Tick</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3>Plant Crops</h3>
                <div class="crop-grid" id="crop-selector"></div>
                <p style="text-align:center; font-size: 0.9em">Selected: <b id="selected-crop-name">None</b></p>
            </div>

            <div class="panel">
                <h3>Upgrades</h3>
                <div class="upgrade-list">
                    <button class="upgrade-btn" id="btn-irrigation" onclick="window.handleUpgrade('IRRIGATION')">
                        <span>Irrigation (Lv <span id="lvl-irrigation">0</span>)</span>
                        <span id="cost-irrigation">$200</span>
                    </button>
                    <button class="upgrade-btn" id="btn-autoharvest" onclick="window.handleUpgrade('AUTO_HARVESTER')">
                        <span>Auto-Harvester</span>
                        <span id="cost-autoharvest">$1000</span>
                    </button>
                </div>
            </div>

            <div class="panel">
                <h3>Leaderboard</h3>
                <ul id="leaderboard"></ul>
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
